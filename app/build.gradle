buildscript {
    repositories {
        maven { url 'https://maven.fabric.io/public' }
    }

    dependencies {
        classpath 'io.fabric.tools:gradle:1.+'
    }
}
apply plugin: 'com.android.application'

repositories {
    maven { url 'https://maven.fabric.io/public' }
}

apply plugin: 'io.fabric'

android {
    signingConfigs {
        config {
            keyAlias 'key0'
            keyPassword 'housemaid@123'
            storeFile file('/home/fluper/android-studio/housemaid_keyStore.jks')
            storePassword 'housemaid@123'
        }
    }
    compileSdkVersion 28
    buildToolsVersion '28.0.3'
    defaultConfig {
        applicationId "com.housemaid"
        minSdkVersion 21
        targetSdkVersion 28
        versionCode 4
        versionName "1.3"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        signingConfig signingConfigs.config
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
            // debuggable true //false when live
        }
    }
    dataBinding {
        enabled = true
    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
    compileOptions {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }
    productFlavors {
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['/home/fluper/Documents/housemaid-android/app/libs']
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    //noinspection GradleCompatible
    implementation 'com.android.support:support-v4:28.0.0'
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'
    implementation 'com.android.support:design:28.0.0'
    implementation 'com.android.support:cardview-v7:28.0.0'
    implementation 'com.android.support:recyclerview-v7:28.0.0'
    implementation 'com.crystal:crystalrangeseekbar:1.1.3'
    implementation 'com.hbb20:ccp:2.2.4'
    implementation 'de.hdodenhof:circleimageview:2.2.0'
    //image library
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.github.bumptech.glide:glide:4.9.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.9.0'

    // retrofit, gson
    implementation 'com.squareup.okhttp3:logging-interceptor:3.11.0'
    implementation 'com.squareup.retrofit2:retrofit:2.4.0'
    implementation 'com.intuit.sdp:sdp-android:1.0.6'
    implementation 'com.squareup.retrofit2:converter-gson:2.3.0'

    //noinspection GradleCompatible
    implementation 'com.google.firebase:firebase-core:16.0.8'
    implementation 'com.google.firebase:firebase-messaging:17.5.0'
    implementation 'com.google.firebase:firebase-crash:16.2.1'
    implementation 'com.google.firebase:firebase-database:16.1.0'

    implementation 'com.google.android.libraries.places:places:1.1.0'
    //implementation 'com.google.android.gms:play-services-places:16.0.0'
    implementation 'com.google.android.gms:play-services-location:16.0.0'
    implementation 'com.google.android.gms:play-services-maps:16.1.0'

    //video Call Agora
//    implementation 'io.agora.rtc:full-sdk:2.3.2'
    //ViewPagerIndicator
    implementation 'com.googlecode.android-query:android-query:0.24.3'
    //imagePicker
    //implementation 'com.github.himangipatel:ImagePickerUtil:0.1.2'
    implementation 'com.crashlytics.sdk.android:crashlytics:2.9.8'

    //Most Important thing is that you have to
    // -keep class rx.internal.util.unsafe.** { *; } in progaurd-rules//
    implementation project(':imagepicker')
    //-keep class rx.internal.util.unsafe.** { *; } in progaurd-rules
    //-keep class rx.internal.util.unsafe.** { *; } in progaurd-rules

    androidTestImplementation 'junit:junit:4.12'

    // used For Auto OTP Detection
    implementation 'com.google.android.gms:play-services-auth-api-phone:16.0.0'

}

apply plugin: 'com.google.gms.google-services'


apply plugin: 'com.google.gms.google-services'
